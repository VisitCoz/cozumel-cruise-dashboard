name: Update Cruise Schedule

on:
  schedule:
    # Runs daily at 5:00 AM Cozumel time (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Scrape current month
        run: node scrape-schedule.js

      - name: Scrape next month
        run: |
          NEXT_MONTH=$(date -d "next month" +%Y' '%m | sed 's/ 0/ /')
          node scrape-schedule.js $NEXT_MONTH

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git diff --quiet schedule-data.json || {
            git add schedule-data.json
            git commit -m "Auto-update cruise schedule $(date +%Y-%m-%d)"
            git push
          }
